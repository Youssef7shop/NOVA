<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Orders - NOVA</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <style>
    .orders-page {
      min-height: 100vh;
      padding: 110px 24px 50px;
    }

    .orders-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .orders-title h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    .orders-title p {
      margin: 0;
      opacity: .7;
    }

    .orders-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nova-btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nova-btn-primary {
      background: #111827;
      color: white;
    }

    .nova-btn-secondary {
      background: rgba(127,127,127,.12);
      color: inherit;
    }

    .orders-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .order-tab {
      border: 0;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(127,127,127,.1);
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }

    .order-tab.active {
      background: #111827;
      color: white;
    }

    .orders-grid {
      display: grid;
      gap: 16px;
    }

    .order-card {
      border: 1px solid rgba(127,127,127,.16);
      border-radius: 18px;
      padding: 20px;
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(10px);
    }

    body.dark .order-card {
      background: rgba(20,20,20,.7);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .order-info h3 {
      margin: 0 0 8px;
    }

    .order-id {
      font-size: 13px;
      opacity: .55;
    }

    .order-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .meta-item {
      padding: 8px 11px;
      border-radius: 10px;
      background: rgba(127,127,127,.1);
      font-size: 13px;
    }

    .status {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .status-pending {
      background: rgba(234,179,8,.15);
      color: #a16207;
    }

    .status-paid {
      background: rgba(59,130,246,.15);
      color: #2563eb;
    }

    .status-in_progress {
      background: rgba(139,92,246,.15);
      color: #7c3aed;
    }

    .status-delivered {
      background: rgba(14,165,233,.15);
      color: #0284c7;
    }

    .status-completed {
      background: rgba(34,197,94,.15);
      color: #16a34a;
    }

    .status-cancelled {
      background: rgba(239,68,68,.15);
      color: #dc2626;
    }

    .order-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(127,127,127,.12);
      flex-wrap: wrap;
    }

    .order-price {
      font-size: 22px;
      font-weight: 800;
    }

    .empty-orders {
      text-align: center;
      padding: 70px 20px;
      border: 1px dashed rgba(127,127,127,.3);
      border-radius: 20px;
    }

    .empty-orders-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      opacity: .7;
    }

    .error-box {
      padding: 16px;
      border-radius: 12px;
      background: rgba(239,68,68,.1);
      color: #dc2626;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 700px) {
      .orders-page {
        padding-left: 15px;
        padding-right: 15px;
      }

      .orders-title h1 {
        font-size: 28px;
      }

      .order-top {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="container nav-container">

      <a href="index.html" class="logo">
        NOVA
      </a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="orders.html" class="active">Orders</a>
        <a href="profile.html">Profile</a>
      </nav>

      <div class="nav-actions">
        <button
          id="themeToggle"
          class="icon-btn"
          type="button"
          aria-label="Toggle theme"
        >
          🌙
        </button>

        <button
          id="logoutBtn"
          class="nova-btn nova-btn-secondary"
          type="button"
        >
          Logout
        </button>
      </div>

    </div>
  </header>

  <main class="orders-page">

    <div class="orders-container">

      <div class="orders-header">

        <div class="orders-title">
          <h1>My Orders</h1>
          <p>Track and manage all your NOVA orders.</p>
        </div>

        <div class="orders-actions">
          <a
            href="services.html"
            class="nova-btn nova-btn-primary"
          >
            + New Order
          </a>
        </div>

      </div>

      <div
        id="errorBox"
        class="error-box"
      ></div>

      <div class="orders-tabs">

        <button
          class="order-tab active"
          data-status="all"
        >
          All
        </button>

        <button
          class="order-tab"
          data-status="pending"
        >
          Pending
        </button>

        <button
          class="order-tab"
          data-status="in_progress"
        >
          In Progress
        </button>

        <button
          class="order-tab"
          data-status="delivered"
        >
          Delivered
        </button>

        <button
          class="order-tab"
          data-status="completed"
        >
          Completed
        </button>

        <button
          class="order-tab"
          data-status="cancelled"
        >
          Cancelled
        </button>

      </div>

      <div
        id="ordersLoading"
        class="loading"
      >
        Loading your orders...
      </div>

      <div
        id="ordersGrid"
        class="orders-grid"
      ></div>

      <div
        id="emptyOrders"
        class="empty-orders"
        style="display:none;"
      >
        <div class="empty-orders-icon">
          📦
        </div>

        <h2>No orders yet</h2>

        <p>
          You haven't placed any orders yet.
        </p>

        <br>

        <a
          href="services.html"
          class="nova-btn nova-btn-primary"
        >
          Explore Services
        </a>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

  <script>
    "use strict";

    const supabaseClient = window.NOVA_SUPABASE;

    let allOrders = [];
    let currentStatus = "all";

    const ordersGrid =
      document.getElementById("ordersGrid");

    const ordersLoading =
      document.getElementById("ordersLoading");

    const emptyOrders =
      document.getElementById("emptyOrders");

    const errorBox =
      document.getElementById("errorBox");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    function formatPrice(price) {
      const amount = Number(price || 0);

      return new Intl.NumberFormat(
        "en-US",
        {
          style: "currency",
          currency: "USD"
        }
      ).format(amount);
    }

    function formatDate(date) {
      if (!date) return "—";

      return new Date(date).toLocaleDateString(
        undefined,
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );
    }

    function statusClass(status) {
      return String(status || "pending")
        .toLowerCase()
        .replace(/\s+/g, "_");
    }

    function renderOrders() {

      ordersGrid.innerHTML = "";

      let filtered = allOrders;

      if (currentStatus !== "all") {
        filtered =
          allOrders.filter(
            order =>
              order.status === currentStatus
          );
      }

      if (!filtered.length) {

        emptyOrders.style.display = "block";

        return;
      }

      emptyOrders.style.display = "none";

      filtered.forEach(order => {

        const serviceName =
          order.services?.title ||
          order.service_title ||
          "NOVA Service";

        const card =
          document.createElement("article");

        card.className = "order-card";

        card.innerHTML = `
          <div class="order-top">

            <div class="order-info">

              <h3>
                ${escapeHtml(serviceName)}
              </h3>

              <div class="order-id">
                Order #${escapeHtml(
                  String(order.id).slice(0, 8)
                )}
              </div>

            </div>

            <span class="status status-${statusClass(order.status)}">
              ${escapeHtml(
                String(order.status || "pending")
                  .replaceAll("_", " ")
              )}
            </span>

          </div>

          <div class="order-meta">

            <div class="meta-item">
              📅 ${formatDate(order.created_at)}
            </div>

            <div class="meta-item">
              📦 Quantity: ${Number(order.quantity || 1)}
            </div>

            ${
              order.worker_id
                ? `
                  <div class="meta-item">
                    👨‍💻 Worker assigned
                  </div>
                `
                : `
                  <div class="meta-item">
                    ⏳ Waiting for worker
                  </div>
                `
            }

          </div>

          <div class="order-bottom">

            <div>
              <div style="font-size:12px;opacity:.6;">
                Total
              </div>

              <div class="order-price">
                ${formatPrice(order.total_amount)}
              </div>
            </div>

            <button
              class="nova-btn nova-btn-secondary view-order-btn"
              data-id="${escapeHtml(order.id)}"
            >
              View Order
            </button>

          </div>
        `;

        ordersGrid.appendChild(card);
      });

      document
        .querySelectorAll(".view-order-btn")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const id =
                button.dataset.id;

              window.location.href =
                `orders.html?id=${encodeURIComponent(id)}`;

            }
          );

        });
    }

    async function loadOrders() {

      try {

        ordersLoading.style.display = "block";
        errorBox.style.display = "none";

        const {
          data: {
            user
          },
          error: authError
        } =
          await supabaseClient.auth.getUser();

        if (authError) {
          throw authError;
        }

        if (!user) {

          window.location.href =
            "login.html";

          return;
        }

        /*
         * Orders table is expected to contain:
         * id
         * client_id
         * worker_id
         * service_id
         * quantity
         * total_amount
         * status
         * created_at
         */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("orders")
            .select(`
              id,
              client_id,
              worker_id,
              service_id,
              quantity,
              total_amount,
              status,
              created_at,
              services (
                title
              )
            `)
            .eq(
              "client_id",
              user.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );

        if (error) {
          throw error;
        }

        allOrders = data || [];

        renderOrders();

      } catch (error) {

        console.error(
          "NOVA Orders Error:",
          error
        );

        showError(
          error.message ||
          "Could not load your orders."
        );

      } finally {

        ordersLoading.style.display = "none";

      }
    }

    document
      .querySelectorAll(".order-tab")
      .forEach(tab => {

        tab.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".order-tab")
              .forEach(item =>
                item.classList.remove("active")
              );

            tab.classList.add("active");

            currentStatus =
              tab.dataset.status;

            renderOrders();

          }
        );

      });

    document
      .getElementById("logoutBtn")
      ?.addEventListener(
        "click",
        async () => {

          await supabaseClient.auth.signOut();

          window.location.href =
            "login.html";

        }
      );

    loadOrders();

  </script>

</body>
</html>
