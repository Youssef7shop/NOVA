<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — NOVA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-inner">

      <a href="index.html" class="logo">
        <span class="logo-mark">N</span>
        <span>NOVA</span>
      </a>

      <div class="nav-actions">

        <button
          id="themeToggle"
          class="icon-btn"
          type="button"
          aria-label="Change theme"
        >
          ◐
        </button>

        <a href="login.html" class="btn btn-ghost">
          Login
        </a>

      </div>

    </div>
  </header>


  <!-- REGISTER -->
  <main class="auth-page">

    <div class="auth-container">

      <div class="auth-card">

        <!-- HEADER -->
        <div class="auth-header">

          <div class="auth-logo">
            N
          </div>

          <h1>Create your NOVA account</h1>

          <p>
            Join NOVA and start using digital services.
          </p>

        </div>


        <!-- MESSAGE -->
        <div
          id="authMessage"
          class="auth-message"
          style="display:none;"
        ></div>


        <!-- REGISTER FORM -->
        <form id="registerForm" class="auth-form">

          <!-- FIRST NAME -->
          <div class="form-group">

            <label for="firstName">
              First name
            </label>

            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="Enter your first name"
              autocomplete="given-name"
              required
            >

          </div>


          <!-- LAST NAME -->
          <div class="form-group">

            <label for="lastName">
              Last name
            </label>

            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Enter your last name"
              autocomplete="family-name"
              required
            >

          </div>


          <!-- EMAIL -->
          <div class="form-group">

            <label for="email">
              Email address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >

          </div>


          <!-- PASSWORD -->
          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              minlength="8"
              required
            >

          </div>


          <!-- CONFIRM PASSWORD -->
          <div class="form-group">

            <label for="confirmPassword">
              Confirm password
            </label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repeat your password"
              autocomplete="new-password"
              minlength="8"
              required
            >

          </div>


          <!-- TERMS -->
          <label class="auth-checkbox">

            <input
              type="checkbox"
              id="terms"
              required
            >

            <span>
              I agree to the NOVA Terms of Service and Privacy Policy.
            </span>

          </label>


          <!-- SUBMIT -->
          <button
            type="submit"
            class="btn btn-primary auth-submit"
          >
            Create Account
          </button>

        </form>


        <!-- DIVIDER -->
        <div class="auth-divider">
          <span>or</span>
        </div>


        <!-- GOOGLE -->
        <button
          type="button"
          class="btn btn-ghost social-login"
          data-google-login
        >
          <span class="google-icon">G</span>
          Continue with Google
        </button>


        <!-- LOGIN -->
        <div class="auth-footer">

          <span>
            Already have an account?
          </span>

          <a href="login.html">
            Login
          </a>

        </div>

      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="container">

      <div class="footer-bottom">

        <span>
          © 2026 NOVA. All rights reserved.
        </span>

      </div>

    </div>

  </footer>


  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js"></script>

  <script src="js/app.js"></script>

  <script src="js/auth.js"></script>

</body>
</html>
